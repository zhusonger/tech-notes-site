<!doctype html>
<html lang="zh-CN" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      标题与描述由服务端按站点设置注入（见 server/shell.mjs），这里只留中性默认值。
      为什么不能写在这里：爬虫与分享卡片不执行 JS，写死的文案会在后台改名后
      继续挂在搜索结果里，而页面上看不出任何异常。
    -->
    <title>Tech Notes</title>
    <meta
      name="description"
      content="个人技术主页：技术笔记、项目实践与思考沉淀。"
    />
    <!-- favicon：换图时把 ?v= 递增（浏览器 / Cloudflare 对 favicon 缓存极顽固） -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=1" />
    <link rel="icon" href="/favicon.ico?v=1" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=1" />
    <meta name="theme-color" content="#F26B1D" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
